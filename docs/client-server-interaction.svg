<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title description">
  <title id="title">Схема взаємодії клієнтської частини UniSwap із серверним API</title>
  <desc id="description">Основний потік від користувача через React, API-модуль і Fetch API до серверного API, прикладного рівня, інфраструктури та PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#344054"/>
    </marker>
  </defs>
  <rect width="1400" height="260" fill="#fff"/>
  <g fill="#f8fafc" stroke="#475467" stroke-width="2">
    <rect x="20" y="100" width="150" height="78" rx="4"/>
    <rect x="220" y="100" width="160" height="78" rx="4"/>
    <rect x="430" y="100" width="150" height="78" rx="4"/>
    <rect x="630" y="100" width="150" height="78" rx="4"/>
    <rect x="830" y="100" width="160" height="78" rx="4"/>
    <rect x="1040" y="100" width="160" height="78" rx="4"/>
    <rect x="1250" y="100" width="130" height="78" rx="4"/>
  </g>
  <g font-family="Arial, 'Segoe UI', sans-serif" fill="#17212f" text-anchor="middle" font-size="19">
    <text x="95" y="146">Користувач</text>
    <text x="300" y="132"><tspan x="300">React + TypeScript</tspan><tspan x="300" dy="26">frontend</tspan></text>
    <text x="505" y="146">API-модуль</text>
    <text x="705" y="132"><tspan x="705">HTTP</tspan><tspan x="705" dy="26">Fetch API</tspan></text>
    <text x="910" y="132"><tspan x="910">ASP.NET Core</tspan><tspan x="910" dy="26">Web API</tspan></text>
    <text x="1120" y="132"><tspan x="1120">Application /</tspan><tspan x="1120" dy="26">Infrastructure</tspan></text>
    <text x="1315" y="146">PostgreSQL</text>
    <text x="805" y="37" fill="#475467" font-size="17"><tspan x="805">JSON, access token,</tspan><tspan x="805" dy="23">image / Blob</tspan></text>
    <text x="1225" y="90" fill="#475467" font-size="16">дані</text>
  </g>
  <g fill="none" stroke="#344054" stroke-width="2" marker-end="url(#arrow)">
    <path d="M170 139 H210"/>
    <path d="M380 139 H420"/>
    <path d="M580 139 H620"/>
    <path d="M780 139 H820"/>
    <path d="M990 139 H1030"/>
    <path d="M1200 139 H1240"/>
  </g>
</svg>
